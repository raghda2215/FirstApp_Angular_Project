<h2 mat-dialog-title>Delete this element?</h2>
<mat-dialog-content>This will delete the element that are currently selected and cannot be undone.</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
