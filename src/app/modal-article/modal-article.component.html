<mat-dialog-content [formGroup]="form">
    <mat-form-field>
      <input matInput placeholder="Title" formControlName="titre" />
    </mat-form-field>
  
    <mat-form-field>
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        <mat-option [value]="option.value" *ngFor="let option of foods">{{ option.viewValue }}</mat-option>
  
      </mat-select>
    </mat-form-field>
  
    <mat-form-field>
      <input matInput placeholder="Link" formControlName="lien" />
    </mat-form-field>
  
    <mat-form-field>
      <mat-label>Choose a date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  
    <mat-form-field>
      <input matInput placeholder="PDF Source" formControlName="sourcePDF" />
    </mat-form-field>
  </mat-dialog-content>
  
  <mat-dialog-actions>
    <button mat-raised-button (click)="close()">Close</button>
    <button mat-raised-button color="primary" (click)="save()">Save</button>
  </mat-dialog-actions>
