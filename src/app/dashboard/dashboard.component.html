<div class="dashboard-container">

    <div class="cards-grid">
      <mat-card class="dashboard-card">
        <mat-card-title>Members</mat-card-title>
        <mat-card-content>{{NbrMembers}}</mat-card-content>
      </mat-card>
  
      <mat-card class="dashboard-card">
        <mat-card-title>Articles</mat-card-title>
        <mat-card-content>{{NbArticles}}</mat-card-content>
      </mat-card>
  
      <mat-card class="dashboard-card">
        <mat-card-title>Events</mat-card-title>
        <mat-card-content>{{NbEvents}}</mat-card-content>
      </mat-card>
  
      <mat-card class="dashboard-card">
        <mat-card-title>Tools</mat-card-title>
        <mat-card-content>{{NbTools}}</mat-card-content>
      </mat-card>
    </div>
  
    <div class="charts-grid">

        <!-- Chart Doughnut -->
        <div class="chart-wrapper">
            <h3>Événements: Sfax / Tunis / Sousse</h3>
            <canvas baseChart
            [type]="'doughnut'"
            [datasets]="chartDataDoughnut"
            [labels]="chartLabelsDoughnut"
            [options]="chartOptions">
            </canvas>
        </div>

        <!-- Chart Pie -->
        <!-- Compter événements par lieu Statique -->
        <div class="chart-wrapper">
            <h3>Membres: Étudiants vs Professeurs</h3>
            <canvas baseChart
            [type]="'pie'"
            [datasets]="chartDataPie"
            [labels]="chartLabelsPie"
            [options]="chartOptions">
            </canvas>
        </div>

        <!-- Chart Bar -->
        <!-- Compter événements par lieu Statique -->
        <div class="chart-wrapper">
            <h3></h3>
            <canvas baseChart
            [type]="'bar'"
            [datasets]="chartDataBar"
            [labels]="chartLabelsBar"
            [options]="chartOptions">
            </canvas>
        </div>

        <!-- Chart Line -->
        <div class="chart-wrapper">
            <h3></h3>
            <canvas baseChart
            [type]="'line'"
            [datasets]="chartDataLine"
            [labels]="chartLabelsLine"
            [options]="chartOptions">
            </canvas>
        </div>

    </div>
  
  </div>
